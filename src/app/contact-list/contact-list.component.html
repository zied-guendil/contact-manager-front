<div class="container">

  <div class="header">
    <h1>Contacts</h1>

    <a mat-raised-button color="primary" routerLink="/contacts/new">
      New contact
    </a>
  </div>

  <mat-form-field class="full-width">
    <mat-label>Filter</mat-label>
    <input
      matInput
      placeholder="Search by name, email..."
      (keyup)="applyFilter($event)">
  </mat-form-field>

  <table mat-table [dataSource]="dataSource" matSort class="full-width mat-elevation-z2">

    <ng-container matColumnDef="firstName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> <b class="term">First name</b></th>
      <td mat-cell *matCellDef="let contact">{{ contact.firstName }}</td>
    </ng-container>

    <ng-container matColumnDef="lastName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header><b class="term">Last name</b></th>
      <td mat-cell *matCellDef="let contact">{{ contact.lastName }}</td>
    </ng-container>

    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef><b class="term">Phone</b></th>
      <td mat-cell *matCellDef="let contact">{{ contact.phone }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header><b class="term">Email</b></th>
      <td mat-cell *matCellDef="let contact">{{ contact.email }}</td>
    </ng-container>

    <ng-container matColumnDef="address">
      <th mat-header-cell *matHeaderCellDef mat-sort-header><b class="term">Address</b></th>
      <td mat-cell *matCellDef="let contact">{{ contact.address }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef><b class="term">Actions</b></th>
      <td mat-cell *matCellDef="let contact">
        <a mat-button [routerLink]="['/contacts', contact.id]">View</a>
        <a mat-button [routerLink]="['/contacts', contact.id, 'edit']">Edit</a>
        <button mat-button color="warn" (click)="deleteContact(contact)">Delete</button>
      </td>
     
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    
  </table>

  <div class="export-CSV">
    <button mat-raised-button color="accent" (click)="exportCsv()">
      Export CSV
    </button>
  </div>

</div>
